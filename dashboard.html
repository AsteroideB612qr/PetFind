<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetFind - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="content" class="max-w-3xl mx-auto p-5">
    <p class="text-gray-500 text-center animate-pulse mt-20">Cargando tu panel privado...</p>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCqX-LAgu49o55vCvvR4h9_VOUBP6e5Tn0",
      authDomain: "petfind-50fb3.firebaseapp.com",
      projectId: "petfind-50fb3",
      storageBucket: "petfind-50fb3.firebasestorage.app",
      messagingSenderId: "1077014067959",
      appId: "1:1077014067959:web:b26d75c1b708b458b971f2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const urlParams = new URLSearchParams(window.location.search);
    const tagId = urlParams.get('id');

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        document.getElementById('content').innerHTML = `
          <div class="text-center mt-20">
            <p class="text-xl text-gray-600 mb-4">Debes iniciar sesión para ver tu panel.</p>
            <a href="scan.html?id=${tagId}" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold">Volver a Reclamar</a>
          </div>`;
        return;
      }

      const petSnap = await db.collection("pets").doc(tagId).get();
      if (petSnap.exists) {
        renderDashboard(petSnap.data());
      } else {
        document.getElementById('content').innerHTML = "<p class='text-red-500 text-center mt-20'>Perfil no encontrado.</p>";
      }
    });

    function renderDashboard(pet) {
      document.getElementById('content').innerHTML = `
        <div class="flex items-center justify-between mb-8 pt-8">
          <div class="flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" /></svg>
            <h1 class="text-3xl font-extrabold text-slate-800">Panel Premium</h1>
          </div>
          <button onclick="auth.signOut()" class="text-gray-500 hover:text-red-500 text-sm font-medium">Cerrar Sesión</button>
        </div>

        <div class="bg-white rounded-3xl shadow-xl overflow-hidden mb-6">
          <div class="p-6 bg-gradient-to-r from-blue-600 to-indigo-700 text-white">
            <h2 class="text-xl font-bold">Perfil de la Mascota</h2>
          </div>
          <div class="p-6 space-y-5">
            <div class="flex flex-col items-center mb-4">
              <img id="imgPreview" src="${pet.photoUrl || 'https://via.placeholder.com/150'}" alt="Foto" class="w-32 h-32 rounded-full object-cover shadow-lg mb-2 border-4 border-white">
              <input type="file" id="photoFile" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
              <button onclick="document.getElementById('photoFile').click()" class="bg-blue-100 text-blue-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-200 transition">
                📸 Subir Foto
              </button>
            </div>
            
            <div>
              <label class="block text-gray-700 font-medium mb-1">Nombre de la Mascota</label>
              <input type="text" id="petName" value="${pet.name || ''}" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
              <label class="block text-gray-700 font-medium mb-1">Descripción</label>
              <textarea id="petDesc" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 h-24">${pet.description || ''}</textarea>
            </div>

            <div>
              <label class="block text-gray-700 font-medium mb-1">🚨 Alertas Médicas (Muy importante para rescatistas)</label>
              <input type="text" id="petAlerts" value="${pet.medicalAlerts || ''}" placeholder="Ej: Diabético, necesita insulina. Alérgico al pollo." class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
              <label class="block text-gray-700 font-medium mb-1">Número de WhatsApp</label>
              <input type="text" id="petPhone" value="${pet.ownerPhone || ''}" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500">
            </div>

            <button onclick="savePublicProfile()" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-4 rounded-xl font-bold text-lg shadow-md">
              💾 Guardar Cambios
            </button>
          </div>
        </div>

        <div class="bg-white rounded-3xl shadow-xl overflow-hidden mb-6">
          <div class="p-6 bg-gradient-to-r from-emerald-500 to-teal-600 text-white">
            <h2 class="text-xl font-bold">📋 Expediente Médico Privado</h2>
          </div>
          <div class="p-6 space-y-5">
            <div>
              <label class="block text-gray-700 font-medium mb-1">Vacunas Aplicadas</label>
              <textarea id="petVaccines" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 h-24" placeholder="Ej: Rabia (10/2023), Parvovirus (10/2023)">${pet.vaccines || ''}</textarea>
            </div>

            <div>
              <label class="block text-gray-700 font-medium mb-1">Próximas Citas Veterinarias</label>
              <input type="text" id="petAppointments" value="${pet.appointments || ''}" placeholder="Ej: Control dental el 15 de Diciembre" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500">
            </div>

            <button onclick="saveMedicalProfile()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-4 rounded-xl font-bold text-lg shadow-md">
              💾 Guardar Expediente Médico
            </button>
          </div>
        </div>

        <div class="text-center pb-10">
          <a href="scan.html?id=${tagId}" target="_blank" class="text-blue-600 underline">Ver cómo se ve mi perfil público</a>
        </div>
      `;
    }

    // Lógica para tomar la foto del celular, comprimirla y guardarla como texto (Base64)
    window.handleFileSelect = function(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          
          const MAX_WIDTH = 300;
          const MAX_HEIGHT = 300;
          let width = img.width;
          let height = img.height;
          
          if (width > height) {
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
          }
          
          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);
          
          const dataURL = canvas.toDataURL('image/jpeg', 0.7);
          document.getElementById('imgPreview').src = dataURL;
          window.base64Photo = dataURL;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

    window.savePublicProfile = async function() {
      const data = {
        photoUrl: window.base64Photo || document.getElementById('imgPreview').src,
        name: document.getElementById('petName').value,
        description: document.getElementById('petDesc').value,
        medicalAlerts: document.getElementById('petAlerts').value,
        ownerPhone: document.getElementById('petPhone').value
      };
      try {
        await db.collection("pets").doc(tagId).update(data);
        alert("¡Perfil público guardado con éxito!");
      } catch (e) { alert("Error: " + e.message); }
    }

    window.saveMedicalProfile = async function() {
      const data = {
        vaccines: document.getElementById('petVaccines').value,
        appointments: document.getElementById('petAppointments').value
      };
      try {
        await db.collection("pets").doc(tagId).update(data);
        alert("¡Expediente médico guardado!");
      } catch (e) { alert("Error: " + e.message); }
    }
  </script>
</body>
</html>
