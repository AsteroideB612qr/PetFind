<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetFind - Panel de Administración</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-8">
  <div class="max-w-4xl mx-auto">
    <div class="flex items-center justify-center mb-8 gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
      </svg>
      <h1 class="text-4xl font-extrabold text-blue-800 tracking-tight">PetFind</h1>
    </div>
    <p class="text-center text-gray-600 mb-10 text-lg">Panel de Super Admin - Generación de Medallas QR</p>
    
    <div class="bg-white p-8 rounded-2xl shadow-xl mb-8 border border-gray-100">
      <h2 class="text-2xl font-bold mb-6 text-gray-800 flex items-center gap-2">
        <span>🏷️</span> Generar Nueva Medalla
      </h2>
      
      <div class="space-y-5">
        <div>
          <label class="block text-gray-700 mb-2 font-medium">Nombre de la mascota (Uso interno)</label>
          <input type="text" id="petName" placeholder="Ej: Max (Perro de Juan)" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
        </div>

        <div>
          <label class="block text-gray-700 mb-2 font-medium">Número de WhatsApp del dueño (Con código de país, sin +)</label>
          <input type="text" id="phone" placeholder="Ej: 521234567890" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
        </div>

        <div>
          <label class="block text-gray-700 mb-2 font-medium">Mensaje predeterminado que verá quien escanee</label>
          <textarea id="message" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition h-24">¡Hola! Encontré a tu mascota. Te comparto mi ubicación para que puedas recuperarla:</textarea>
        </div>

        <button onclick="createTag()" class="w-full bg-blue-600 text-white px-6 py-4 rounded-xl hover:bg-blue-700 font-bold text-lg shadow-md transition transform hover:scale-[1.02]">
          Generar Medalla y Código QR
        </button>
      </div>
    </div>

    <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
      <h2 class="text-2xl font-bold mb-6 text-gray-800 flex items-center gap-2">
        <span>📋</span> Medallas Creadas
      </h2>
      <div id="tagsList" class="space-y-4"></div>
    </div>
  </div>

  <script>
    // === CONFIGURACIÓN FIREBASE ===
    const firebaseConfig = {
      apiKey: "AIzaSyCqX-LAgu49o55vCvvR4h9_VOUBP6e5Tn0",
      authDomain: "petfind-50fb3.firebaseapp.com",
      projectId: "petfind-50fb3",
      storageBucket: "petfind-50fb3.firebasestorage.app",
      messagingSenderId: "1077014067959",
      appId: "1:1077014067959:web:b26d75c1b708b458b971f2"
    };
    // ==============================

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // URL de tu página pública
    const BASE_URL = "https://petfind-omega.vercel.app/scan.html?id=";

    // Función para crear una medalla
    function createTag() {
      const petName = document.getElementById('petName').value;
      const phone = document.getElementById('phone').value;
      const message = document.getElementById('message').value;

      if (!phone || !message) {
        alert("Por favor ingresa un número de WhatsApp y un mensaje");
        return;
      }

      db.collection("tags").add({
        petName: petName,
        phone: phone,
        message: message,
        claimed: false,
        createdAt: new Date()
      }).then((docRef) => {
        alert("¡Medalla creada con éxito! Generando QR...");
        
        // Generar y abrir QR en nueva pestaña
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${BASE_URL}${docRef.id}`;
        window.open(qrUrl, '_blank');
        
        // Limpiar formulario
        document.getElementById('petName').value = "";
        document.getElementById('phone').value = "";
        
        // Recargar lista
        loadTags();
      }).catch((error) => {
        alert("Error al crear: " + error);
      });
    }

    // Función para cargar las medallas existentes
    function loadTags() {
      const list = document.getElementById('tagsList');
      list.innerHTML = "<p class='text-gray-400 text-center py-4'>Cargando medallas...</p>";
      
      db.collection("tags").orderBy("createdAt", "desc").get().then((querySnapshot) => {
        list.innerHTML = "";
        if (querySnapshot.empty) {
          list.innerHTML = "<p class='text-gray-400 text-center py-4'>No hay medallas creadas todavía. Crea la primera arriba 👆</p>";
          return;
        }
        
        querySnapshot.forEach((doc) => {
          const tag = doc.data();
          const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${BASE_URL}${doc.id}`;
          
          const html = `
            <div class="flex justify-between items-center p-4 bg-gray-50 rounded-xl border border-gray-100">
              <div class="flex-1">
                <p class="font-bold text-gray-800 text-lg">${tag.petName || 'Sin nombre'}</p>
                <p class="text-sm text-gray-500">📞 WhatsApp: ${tag.phone}</p>
                <p class="text-xs text-gray-400 mt-1 break-all">ID: ${doc.id}</p>
              </div>
              <button onclick="window.open('${qrUrl}', '_blank')" class="bg-blue-100 text-blue-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-200 transition">
                Ver/Descargar QR
              </button>
            </div>
          `;
          list.innerHTML += html;
        });
      }).catch((error) => {
        console.error("Error al cargar: ", error);
        list.innerHTML = "<p class='text-red-400 text-center py-4'>Error al cargar. Revisa tu conexión a Firebase.</p>";
      });
    }

    // Cargar al iniciar
    loadTags();
  </script>
</body>
</html>
