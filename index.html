<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PetFind - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script>
    const ADMIN_EMAIL = "activosonlineqr@gmail.com"; 
  </script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-4 md:p-8">

  <!-- VISTA DE LOGIN -->
  <div id="loginView" class="flex items-center justify-center min-h-screen">
    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
      <img src="logo.png" alt="PetFind" class="h-20 mx-auto mb-6">
      <h2 class="text-2xl font-bold text-gray-800 mb-4">Panel Super Admin</h2>
      <p class="text-gray-500 mb-6 text-sm">Acceso restringido. Inicia sesión para continuar.</p>
      <input type="email" id="loginEmail" placeholder="Tu correo de Admin" class="w-full p-3 border rounded-xl mb-3 text-base">
      <input type="password" id="loginPass" placeholder="Contraseña" class="w-full p-3 border rounded-xl mb-4 text-base">
      <button onclick="loginAdmin()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold hover:bg-blue-700 text-base">Ingresar</button>
      <p id="loginError" class="text-red-500 text-sm mt-3 hidden">Credenciales incorrectas o no tienes permiso.</p>
    </div>
  </div>

  <!-- VISTA DEL PANEL -->
  <div id="adminView" class="hidden max-w-5xl mx-auto">
    <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
      <img src="logo.png" alt="PetFind" class="h-16">
      <div class="flex gap-2 w-full md:w-auto">
        <a href="landing.html" target="_blank" class="flex-1 bg-slate-800 text-white px-4 py-2 rounded-xl font-bold text-sm hover:bg-slate-900 flex items-center justify-center gap-2">👁️ Landing</a>
        <button onclick="logoutAdmin()" class="flex-1 bg-red-100 text-red-700 px-4 py-2 rounded-xl font-bold text-sm hover:bg-red-200">Cerrar Sesión</button>
      </div>
    </div>

    <!-- BARRA DE DIAGNÓSTICO DE SESIÓN: dice exactamente lo que Firestore ve de tu cuenta -->
    <div class="bg-white p-4 rounded-2xl shadow-xl mb-8 border border-gray-100 text-sm">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div id="sessionInfo" class="text-gray-700">Verificando sesión…</div>
        <div class="flex flex-wrap gap-2">
          <button onclick="testAdminPerms()" class="bg-green-100 text-green-700 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-green-200">🧪 Probar Permisos</button>
          <button onclick="refreshSession()" class="bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-blue-200">🔄 Refrescar Token</button>
          <button id="btnResend" onclick="resendVerification()" class="hidden bg-yellow-100 text-yellow-700 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-yellow-200">📧 Reenviar Verificación</button>
        </div>
      </div>
    </div>

    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl mb-8 border border-gray-100">
      <h2 class="text-xl md:text-2xl font-bold mb-6 text-gray-800">💳 Configuración Global</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div><label class="block text-gray-700 mb-2 font-medium text-sm">Billetera</label><input type="text" id="walletName" class="w-full p-3 border rounded-xl text-base"></div>
        <div><label class="block text-gray-700 mb-2 font-medium text-sm">Número de Cuenta</label><input type="text" id="walletNumber" class="w-full p-3 border rounded-xl text-base"></div>
        <div><label class="block text-gray-700 mb-2 font-medium text-sm">Precio Básico (Ej: 10.00)</label><input type="text" id="basicPrice" class="w-full p-3 border rounded-xl text-base"></div>
        <div><label class="block text-gray-700 mb-2 font-medium text-sm">Precio Premium (Ej: 15.00)</label><input type="text" id="subPrice" class="w-full p-3 border rounded-xl text-base"></div>
        <div class="md:col-span-2"><label class="block text-gray-700 mb-2 font-medium text-sm">Correo de Soporte</label><input type="email" id="supportEmail" class="w-full p-3 border rounded-xl text-base"></div>
        <div class="md:col-span-2">
          <label class="block text-gray-700 mb-2 font-medium text-sm">WhatsApp de PetFind</label>
          <div class="flex gap-2">
            <select id="petfindCountry" class="w-1/3 p-3 border rounded-xl text-base"><option value="51">🇵🇪 +51</option><option value="52">🇲🇽 +52</option><option value="57">🇨🇴 +57</option><option value="54">🇦🇷 +54</option><option value="56">🇨🇱 +56</option><option value="34">🇪🇸 +34</option><option value="1">🇺🇸 +1</option></select>
            <input type="text" id="petfindWhatsapp" placeholder="Número sin código" class="w-2/3 p-3 border rounded-xl text-base">
          </div>
        </div>
        <div><label class="block text-gray-700 mb-2 font-medium text-sm">Msg Ventas WhatsApp</label><input type="text" id="waSalesMsg" class="w-full p-3 border rounded-xl text-base"></div>
        <div><label class="block text-gray-700 mb-2 font-medium text-sm">Msg Soporte WhatsApp</label><input type="text" id="waSupportMsg" class="w-full p-3 border rounded-xl text-base"></div>
        <div class="md:col-span-2"><label class="block text-gray-700 mb-2 font-medium text-sm">Msg Rescate (QR)</label><input type="text" id="rescueMsg" class="w-full p-3 border rounded-xl text-base"></div>
      </div>
      <div class="flex flex-col md:flex-row gap-2 mt-4">
        <button onclick="saveSettings()" class="flex-1 bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold text-base">Guardar Config</button>
        <button onclick="updateAllMessages()" class="flex-1 bg-purple-600 text-white px-6 py-3 rounded-xl font-bold text-base">Aplicar Msg a Todas</button>
      </div>
    </div>

    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl mb-8 border border-gray-100">
      <h2 class="text-xl md:text-2xl font-bold mb-6 text-gray-800">🏷️ Generar Nueva Medalla</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div><label class="block text-gray-700 mb-2 font-medium text-sm">Tipo</label><select id="planType" class="w-full p-3 border rounded-xl text-base"><option value="basic">Básico</option><option value="premium">Premium</option></select></div>
        <div class="md:col-span-2"><label class="block text-gray-700 mb-2 font-medium text-sm">Nombre interno</label><input type="text" id="petName" placeholder="Lote 1 - Medalla 05" class="w-full p-3 border rounded-xl text-base"></div>
      </div>
      <button onclick="createTag()" class="mt-4 w-full bg-blue-600 text-white px-6 py-4 rounded-xl font-bold text-base">Generar Medalla y QR</button>
    </div>

    <div class="bg-white p-4 md:p-6 rounded-2xl shadow-xl border border-gray-100">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl md:text-2xl font-bold text-gray-800">📋 Inventario</h2>
        <button onclick="listenTags()" class="bg-blue-100 text-blue-700 px-4 py-2 rounded-xl text-sm font-bold hover:bg-blue-200">🔄 Actualizar</button>
      </div>
      <div id="tagsList" class="space-y-4"></div>
    </div>
  </div>

  <!-- MODAL DEL QR -->
  <div id="qrModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50" onclick="closeQRModal()">
    <div class="bg-white p-6 rounded-2xl max-w-md w-full text-center" onclick="event.stopPropagation()">
      <h3 class="text-xl font-bold mb-4">Código QR de la Medalla</h3>
      <img id="qrImg" src="" class="w-full max-w-[250px] mx-auto rounded-xl mb-4 border">
      <div class="bg-slate-100 p-4 rounded-xl flex justify-between items-center mb-4">
        <span id="qrLink" class="text-xs text-gray-600 break-all text-left flex-1 mr-2">link</span>
        <button onclick="copyQRLink()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap">📋 Copiar</button>
      </div>
      <button onclick="closeQRModal()" class="w-full bg-gray-200 text-gray-700 py-3 rounded-xl font-bold text-base">Cerrar</button>
    </div>
  </div>

  <!-- MODAL DEL HISTORIAL DE RECIBOS -->
  <div id="voucherModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50" onclick="closeVoucher()">
    <div class="bg-white p-4 rounded-2xl max-w-md w-full text-center max-h-[85vh] overflow-y-auto" onclick="event.stopPropagation()">
      <h3 class="text-xl font-bold mb-4">Historial de Recibos</h3>
      <div id="voucherModalBody" class="space-y-4"></div>
      <button onclick="closeVoucher()" class="mt-4 w-full bg-gray-200 text-gray-700 py-3 rounded-xl font-bold text-base">Cerrar</button>
    </div>
  </div>

  <!-- MODAL DEL WHATSAPP -->
  <div id="phoneModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50" onclick="closePhoneModal()">
    <div class="bg-white p-6 rounded-2xl max-w-md w-full text-center" onclick="event.stopPropagation()">
      <h3 class="text-xl font-bold mb-4">Asignar WhatsApp</h3>
      <div class="flex gap-2 mb-4">
        <select id="phoneCountry" class="w-1/3 p-3 border rounded-xl text-base">
          <option value="51">🇵🇪 +51</option><option value="52">🇲🇽 +52</option><option value="57">🇨🇴 +57</option><option value="54">🇦🇷 +54</option><option value="56">🇨🇱 +56</option><option value="34">🇪🇸 +34</option><option value="1">🇺🇸 +1</option>
        </select>
        <input type="text" id="phoneInput" placeholder="Número sin código" class="w-2/3 p-3 border rounded-xl text-base">
      </div>
      <button onclick="savePhone()" class="w-full bg-blue-600 py-3 rounded-xl font-bold text-base">Guardar Número</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCqX-LAgu49o55vCvvR4h9_VOUBP6e5Tn0", authDomain: "petfind-50fb3.firebaseapp.com",
      projectId: "petfind-50fb3", storageBucket: "petfind-50fb3.firebasestorage.app",
      messagingSenderId: "1077014067959", appId: "1:1077014067959:web:b26d75c1b708b458b971f2"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    let currentVoucherTagId = null, currentPhoneTagId = null, currentQRLink = "";

    // Convierte a Date aceptando Timestamp de Firestore O string ISO (compatibilidad con datos antiguos)
    function expToDate(v) { if (!v) return null; return v.seconds ? new Date(v.seconds * 1000) : new Date(v); }

    auth.onAuthStateChanged(user => {
      if (user && user.email === ADMIN_EMAIL) {
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('adminView').classList.remove('hidden');
        loadSettings(); listenTags(); updateSessionBar();
      } else {
        if(user) auth.signOut();
        document.getElementById('loginView').classList.remove('hidden');
        document.getElementById('adminView').classList.add('hidden');
      }
    });

    window.loginAdmin = async function() {
      try {
        const cred = await auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value);
        await cred.user.reload();
        await cred.user.getIdToken(true); // Fuerza un token NUEVO para que Firestore vea el email_verified actualizado
      } catch(e) { document.getElementById('loginError').classList.remove('hidden'); }
    }
    window.logoutAdmin = function() { auth.signOut(); }

    // ─── DIAGNÓSTICO DE SESIÓN ───
    async function updateSessionBar() {
      const info = document.getElementById('sessionInfo');
      const btnResend = document.getElementById('btnResend');
      const user = auth.currentUser;
      if (!user) { info.innerHTML = '<span class="text-red-600 font-bold">Sin sesión activa.</span>'; return; }
      try {
        const tok = await user.getIdTokenResult();
        const emailOk = (user.email || '').toLowerCase() === ADMIN_EMAIL;
        const verified = tok.claims.email_verified === true;
        info.innerHTML =
          '👤 <b>' + user.email + '</b> ' + (emailOk ? '<span class="text-green-600 font-bold">✓ es el correo admin</span>' : '<span class="text-red-600 font-bold">NO es ' + ADMIN_EMAIL + '</span>') +
          ' &nbsp;·&nbsp; 📧 Verificado (lo que ve Firestore): ' + (verified ? '<b class="text-green-600">SÍ</b>' : '<b class="text-red-600">NO</b> → pulsa Refrescar Token o cierra sesión y vuelve a entrar') +
          ' &nbsp;·&nbsp; 🕒 Token emitido: ' + (tok.issuedAtTime ? new Date(tok.issuedAtTime).toLocaleTimeString() : '—');
        btnResend.classList.toggle('hidden', verified);
      } catch(e) { info.textContent = 'Error leyendo el token: ' + e.message; }
    }
    window.refreshSession = async function() {
      const user = auth.currentUser; if (!user) return;
      await user.reload();
      await user.getIdToken(true);
      await updateSessionBar();
      alert('Token actualizado. Ahora usa "🧪 Probar Permisos" para confirmar.');
    }
    window.resendVerification = async function() {
      try { await auth.currentUser.sendEmailVerification(); alert('Correo de verificación enviado. Revisa tu bandeja (y spam), haz clic en el enlace y luego pulsa "🔄 Refrescar Token".'); }
      catch(e) { alert('Error al enviar: ' + e.message); }
    }
    window.testAdminPerms = async function() {
      const ref = db.collection("settings").doc("_diagnostico");
      try {
        await ref.set({ test: true, at: new Date().toISOString() });
        await ref.delete();
        alert('✅ PERMISOS ADMIN CORRECTOS. Firestore aceptó una escritura de prueba (y la borró). Ya puedes guardar config, aprobar pagos, dar días y eliminar medallas.');
      } catch(e) { alert('❌ Firestore RECHAZÓ la escritura de prueba:\n\n' + friendlyError(e)); }
    }
    // Traduce los errores de permisos a pasos accionables
    function friendlyError(e) {
      const msg = (e && e.message) || '';
      if ((e && e.code === 'permission-denied') || msg.indexOf('permission') >= 0) {
        const u = auth.currentUser;
        if (!u) return 'No hay sesión activa. Inicia sesión de nuevo.';
        if ((u.email || '') !== ADMIN_EMAIL) return 'Iniciaste sesión con ' + u.email + ', que NO es el correo admin (' + ADMIN_EMAIL + ').';
        return 'Tu sesión no figura como admin verificado. Casi siempre es el token antiguo (anterior a verificar el correo) → pulsa "🔄 Refrescar Token" arriba o cierra sesión y vuelve a entrar. Si persiste, el correo sigue NO verificado en Firebase Auth → usa "📧 Reenviar Verificación".';
      }
      return msg || 'Error desconocido';
    }

    async function loadSettings() {
      const snap = await db.collection("settings").doc("payment").get();
      if(snap.exists) {
        const s = snap.data();
        document.getElementById('walletName').value = s.walletName || "";
        document.getElementById('walletNumber').value = s.walletNumber || "";
        document.getElementById('supportEmail').value = s.supportEmail || "";
        document.getElementById('petfindWhatsapp').value = s.petfindWhatsapp ? s.petfindWhatsapp.substring(2) : "";
        document.getElementById('petfindCountry').value = s.petfindWhatsapp ? s.petfindWhatsapp.substring(0, 2) : "51";
        document.getElementById('waSalesMsg').value = s.waSalesMsg || "Hola PetFind, me gustaría información sobre las medallas.";
        document.getElementById('waSupportMsg').value = s.waSupportMsg || "Hola PetFind, tuve un problema con mi recibo de pago.";
        document.getElementById('rescueMsg').value = s.rescueMsg || "¡Hola! Encontré a tu mascota. Te escribo desde PetFind para que puedas recuperarla. Te comparto mi ubicación:";
        document.getElementById('subPrice').value = s.subPrice || "15.00";
        document.getElementById('basicPrice').value = s.basicPrice || "10.00";
      }
    }
    window.saveSettings = async function() {
      const fullWa = document.getElementById('petfindCountry').value + document.getElementById('petfindWhatsapp').value;
      try {
        await db.collection("settings").doc("payment").set({ walletName: document.getElementById('walletName').value, walletNumber: document.getElementById('walletNumber').value, supportEmail: document.getElementById('supportEmail').value, petfindWhatsapp: fullWa, waSalesMsg: document.getElementById('waSalesMsg').value, waSupportMsg: document.getElementById('waSupportMsg').value, rescueMsg: document.getElementById('rescueMsg').value, subPrice: document.getElementById('subPrice').value, basicPrice: document.getElementById('basicPrice').value });
        alert("¡Configuración guardada!");
      } catch(e) { alert("Error al guardar: " + friendlyError(e)); }
    }
    // FIX: antes el alert se disparaba antes de que terminaran las escrituras (falso positivo)
    window.updateAllMessages = async function() { 
      const msg = document.getElementById('rescueMsg').value;
      try {
        const snap = await db.collection("tags").get();
        await Promise.all(snap.docs.map(d => d.ref.update({ message: msg })));
        alert("Mensaje actualizado en todas las medallas.");
      } catch(e) { alert("Error al actualizar: " + friendlyError(e)); }
    }

    window.editPhone = function(tagId, p) { currentPhoneTagId = tagId; document.getElementById('phoneCountry').value = p ? p.substring(0, 2) : "51"; document.getElementById('phoneInput').value = p ? p.substring(2) : ""; document.getElementById('phoneModal').classList.remove('hidden'); document.getElementById('phoneModal').classList.add('flex'); }
    window.closePhoneModal = function() { document.getElementById('phoneModal').classList.add('hidden'); }
    window.savePhone = async function() { try { await db.collection("tags").doc(currentPhoneTagId).update({ phone: document.getElementById('phoneCountry').value + document.getElementById('phoneInput').value }); alert("WhatsApp actualizado."); closePhoneModal(); listenTags(); } catch(e) { alert("Error: " + friendlyError(e)); } }

    window.showVouchers = function(tagId) {
      currentVoucherTagId = tagId;
      db.collection("tags").doc(tagId).get().then(doc => {
        const vouchers = doc.data().vouchers || [];
        const body = document.getElementById('voucherModalBody');
        if(vouchers.length === 0) body.innerHTML = "<p class='text-gray-500 py-4'>No hay recibos.</p>";
        else {
          vouchers.sort((a,b) => new Date(b.date) - new Date(a.date));
          body.innerHTML = vouchers.map(v => `
            <div class="border-b pb-4 mb-4 text-left">
              <p class="text-xs text-gray-500 mb-1">Enviado: ${new Date(v.date).toLocaleString()}</p>
              <img src="${v.url}" class="w-full rounded-xl mb-3">
              <p class="text-sm font-bold mb-2 uppercase ${v.status === 'approved' ? 'text-green-600' : v.status === 'rejected' ? 'text-red-600' : 'text-yellow-600'}">Estado: ${v.status}</p>
              <div class="flex flex-col gap-2">
                ${v.status === 'pending' ? `<button onclick="approveVoucher('${tagId}', '${v.id}')" class="bg-green-600 text-white py-3 rounded-xl font-bold text-sm">✅ Aprobar Pago</button><button onclick="rejectVoucher('${tagId}', '${v.id}')" class="bg-red-600 text-white py-3 rounded-xl font-bold text-sm">❌ Rechazar Pago</button>` : `<button onclick="resolveVoucher('${tagId}', '${v.id}')" class="bg-gray-600 text-white py-3 rounded-xl font-bold text-sm">✔️ Superar (Limpiar)</button>`}
              </div>
            </div>`).join('');
        }
        document.getElementById('voucherModal').classList.remove('hidden'); document.getElementById('voucherModal').classList.add('flex');
      });
    }
    window.closeVoucher = function() { document.getElementById('voucherModal').classList.add('hidden'); }
    window.approveVoucher = async function(tagId, vid) { try { const ref = db.collection("tags").doc(tagId); const doc = await ref.get(); let vs = doc.data().vouchers || []; let v = vs.find(x => x.id === vid); if(v) { await ref.update({ vouchers: firebase.firestore.FieldValue.arrayRemove(v), paymentStatus: "approved" }); v.status = "approved"; await ref.update({ vouchers: firebase.firestore.FieldValue.arrayUnion(v) }); alert("¡Aprobado! Recuerda darle +30d."); showVouchers(tagId); } } catch(e) { alert("Error al aprobar: " + friendlyError(e)); } }
    window.rejectVoucher = async function(tagId, vid) { try { const ref = db.collection("tags").doc(tagId); const doc = await ref.get(); let vs = doc.data().vouchers || []; let v = vs.find(x => x.id === vid); if(v) { await ref.update({ vouchers: firebase.firestore.FieldValue.arrayRemove(v), paymentStatus: "rejected" }); v.status = "rejected"; await ref.update({ vouchers: firebase.firestore.FieldValue.arrayUnion(v) }); alert("Rechazado."); showVouchers(tagId); } } catch(e) { alert("Error al rechazar: " + friendlyError(e)); } }
    window.resolveVoucher = async function(tagId, vid) { try { const ref = db.collection("tags").doc(tagId); const doc = await ref.get(); let vs = doc.data().vouchers || []; let v = vs.find(x => x.id === vid); if(v) { await ref.update({ vouchers: firebase.firestore.FieldValue.arrayRemove(v) }); if(vs.length === 1) await ref.update({ paymentStatus: "none" }); alert("Superado."); showVouchers(tagId); } } catch(e) { alert("Error: " + friendlyError(e)); } }

    function generatePlateId() { return 'PF' + Math.floor(100000 + Math.random() * 900000); }

    window.createTag = async function() {
      const petName = document.getElementById('petName').value, planType = document.getElementById('planType').value, message = document.getElementById('rescueMsg').value;
      let newId = generatePlateId(); if((await db.collection("tags").doc(newId).get()).exists) newId = generatePlateId();
      db.collection("tags").doc(newId).set({ petName, phone: "", message, plan: planType, claimed: false, createdAt: new Date(), vouchers: [] })
      .then(() => {
        const link = `https://petfind-omega.vercel.app/scan.html?id=${newId}`;
        showQR(link, `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${link}`);
        document.getElementById('petName').value = ""; listenTags();
      })
      .catch(e => alert("Error al crear la medalla: " + friendlyError(e)));
    }

    window.changePlan = async function(tagId, newPlan) {
      try {
        if(newPlan === 'basic') {
          if(!confirm("¿Bajar a Básico? Se borrará el perfil de la mascota y el QR irá directo a WhatsApp.")) return;
          await db.collection("tags").doc(tagId).update({ plan: 'basic', claimed: false });
          await db.collection("pets").doc(tagId).delete().catch(()=>{});
        } else {
          if(!confirm("¿Subir a Premium? El dueño deberá escanear el QR para reclamar su nuevo perfil.")) return;
          await db.collection("tags").doc(tagId).update({ plan: 'premium', claimed: false });
          await db.collection("pets").doc(tagId).delete().catch(()=>{});
        }
        alert("Plan actualizado."); listenTags();
      } catch(e) { alert("Error al cambiar plan: " + friendlyError(e)); }
    }

    function listenTags() {
      const list = document.getElementById('tagsList');
      list.innerHTML = "<p class='text-gray-400 text-center py-4'>Cargando...</p>";
      db.collection("tags").orderBy("createdAt", "desc").get().then((querySnapshot) => {
        list.innerHTML = "";
        if (querySnapshot.empty) { list.innerHTML = "<p class='text-gray-400 text-center'>No hay medallas.</p>"; return; }
        querySnapshot.forEach((doc) => {
          const tag = doc.data();
          const planTag = tag.plan || 'basic';
          
          const qrLink = `https://petfind-omega.vercel.app/scan.html?id=${doc.id}`;
          const qrImgUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${qrLink}`;
          const planColor = planTag === 'basic' ? 'bg-gray-200 text-gray-700' : 'bg-purple-100 text-purple-700';
          
          let subStatus = "N/A", subColor = "bg-gray-100", payBadge = "", alertBadge = "";
          let actionsHTML = "";
          
          // Botón Ver QR
          actionsHTML += `<button onclick="showQR('${qrLink}', '${qrImgUrl}')" class="bg-blue-100 text-blue-700 px-3 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-1">Ver QR</button>`;
          
          if(planTag === 'basic') {
            subStatus = "Plan Básico"; subColor = "bg-gray-100 text-gray-700";
            
            actionsHTML += `<button onclick="editPhone('${doc.id}', '${tag.phone || ''}')" class="bg-yellow-100 text-yellow-700 px-3 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-1">✏️ WhatsApp</button>`;
            
            actionsHTML += `<button onclick="changePlan('${doc.id}', 'premium')" class="bg-blue-100 text-blue-700 px-3 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-1">⬆️ Subir a Premium</button>`;
            
            if(tag.phone) {
              actionsHTML += `<a href="https://wa.me/${tag.phone}?text=${encodeURIComponent('Hola! Sabías que con el Plan Premium de PetFind tu mascota tendría su perfil web e historial médico? Escríbeme para activarlo. 🐾')}" target="_blank" class="bg-purple-100 text-purple-700 px-3 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-1">🛍️ Ofrecer Premium</a>`;
            } else {
              actionsHTML += `<div class="bg-gray-50 text-gray-400 px-3 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-1">N/A</div>`;
            }
            
          } else if(tag.claimed) {
            let daysLeft = null;
            if(tag.subscriptionExpires) {
              const exp = expToDate(tag.subscriptionExpires);
              if(exp > new Date()) { 
                subStatus = `Activo: ${exp.toLocaleDateString()}`; subColor = "bg-green-100 text-green-700";
                daysLeft = Math.ceil((exp - new Date()) / (1000 * 60 * 60 * 24));
                if(daysLeft <= 5) {
                  alertBadge = `<span class="text-xs bg-orange-200 text-orange-700 px-2 py-0.5 rounded-full ml-1 animate-pulse">⚠️ ${daysLeft}d</span>`;
                }
              } else { subStatus = "Vencido"; subColor = "bg-red-100 text-red-700"; }
            } else { subStatus = "Pendiente Pago"; subColor = "bg-yellow-100 text-yellow-700"; }

            if(tag.paymentStatus === 'pending') payBadge = `<span class="text-xs bg-yellow-200 text-yellow-700 px-2 py-0.5 rounded-full ml-1 animate-pulse">Pago Pendiente</span>`;
            else if(tag.paymentStatus === 'approved') payBadge = `<span class="text-xs bg-blue-200 text-blue-700 px-2 py-0.5 rounded-full ml-1">Aprobado</span>`;
            else if(tag.paymentStatus === 'rejected') payBadge = `<span class="text-xs bg-red-200 text-red-700 px-2 py-0.5 rounded-full ml-1">Rechazado</span>`;
            if(tag.subscriptionExpires && typeof tag.subscriptionExpires === 'string') {
              alertBadge += `<span class="text-xs bg-orange-200 text-orange-800 px-2 py-0.5 rounded-full ml-1" title="Fecha guardada en formato antiguo (texto): la regla de suscripción no la puede leer y bloquea al dueño. Pulsa 🔧 Normalizar.">🔧 formato antiguo</span>`;
            }

            const vCount = tag.vouchers ? tag.vouchers.length : 0;
            if(vCount > 0) {
              actionsHTML += `<button onclick="showVouchers('${doc.id}')" class="bg-orange-100 text-orange-700 px-3 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-1 relative">🧾 Recibos (${vCount})</button>`;
            } else {
              actionsHTML += `<div class="bg-gray-50 text-gray-400 px-3 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-1">Sin Recibos</div>`;
            }
            
            if(daysLeft !== null && daysLeft <= 5) {
              actionsHTML += `<a href="https://wa.me/${tag.phone}?text=${encodeURIComponent('Hola! Tu plan Premium de PetFind vence en ' + daysLeft + ' días. Recuerda renovarlo desde tu panel. 🐾')}" target="_blank" class="bg-green-100 text-green-700 px-3 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-1">🔔 Recordar Pago</a>`;
            } else {
              actionsHTML += `<div class="bg-gray-50 text-gray-400 px-3 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-1">Al día</div>`;
            }

            actionsHTML += `<button onclick="changePlan('${doc.id}', 'basic')" class="bg-gray-100 text-gray-700 px-3 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-1">⬇️ Bajar a Básico</button>`;
            
            actionsHTML += `<div class="col-span-2 md:col-span-4 grid grid-cols-5 gap-1 bg-slate-100 p-1 rounded-lg mt-1">
              <button onclick="adjustDays('${doc.id}', -30)" class="bg-red-100 text-red-700 py-1.5 rounded-md text-xs font-bold">-30d</button>
              <button onclick="adjustDays('${doc.id}', -1)" class="bg-red-100 text-red-700 py-1.5 rounded-md text-xs font-bold">-1d</button>
              <button onclick="adjustDays('${doc.id}', 1)" class="bg-blue-100 text-blue-700 py-1.5 rounded-md text-xs font-bold">+1d</button>
              <button onclick="adjustDays('${doc.id}', 30)" class="bg-green-100 text-green-700 py-1.5 rounded-md text-xs font-bold">+30d</button>
              <button onclick="adjustDays('${doc.id}', 0)" class="bg-yellow-100 text-yellow-700 py-1.5 rounded-md text-xs font-bold" title="Normalizar: guarda la misma fecha en formato nuevo (Timestamp) sin cambiar los días. Corrige el bloqueo por formato antiguo.">🔧</button>
            </div>`;
            
          } else {
            // Premium no reclamado
            subStatus = "Pendiente Reclamo"; subColor = "bg-gray-100 text-gray-700";
            actionsHTML += `<div class="col-span-2 md:col-span-3 text-gray-500 text-sm text-center py-2 bg-slate-50 rounded-lg font-medium">Pendiente de Reclamo por Dueño</div>`;
            actionsHTML += `<button onclick="changePlan('${doc.id}', 'basic')" class="bg-gray-100 text-gray-700 px-3 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-1">⬇️ Bajar</button>`;
          }
          
          actionsHTML += `<button onclick="deleteTag('${doc.id}')" class="bg-red-100 text-red-700 px-3 py-2 rounded-lg text-sm font-bold col-span-2 md:col-span-4 flex items-center justify-center gap-1 mt-1">🗑️ Eliminar Medalla</button>`;
          
          list.innerHTML += `
            <div class="flex flex-col p-3 bg-white rounded-xl border shadow-sm">
              <div class="flex justify-between items-center mb-2 flex-wrap gap-1">
                <div class="flex items-center gap-2 flex-wrap">
                  <p class="font-bold text-gray-800 text-base">${tag.petName || 'Sin nombre'}</p>
                  <span class="text-xs px-2 py-0.5 rounded-full font-bold ${planColor}">${planTag.toUpperCase()}</span>
                  ${tag.claimed ? '<span class="text-xs bg-blue-200 text-blue-700 px-2 py-0.5 rounded-full">Reclamado</span>' : ''}
                </div>
              </div>
              
              <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-sm mb-3 border-b pb-2">
                <span class="font-mono font-bold text-blue-600 truncate">🛡️ ${doc.id}</span>
                <span class="text-gray-500 text-right truncate">📞 ${tag.phone || 'Sin asignar'}</span>
              </div>
              
              <div class="flex justify-between items-center mb-3 flex-wrap gap-1">
                <div class="flex gap-1 flex-wrap">
                  <span class="text-xs px-2 py-0.5 rounded-full font-bold ${subColor}">${subStatus}</span>
                  ${payBadge}
                </div>
                ${alertBadge}
              </div>
              
              <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                ${actionsHTML}
              </div>
            </div>`;
        });
      }).catch((error) => {
        console.error("Error Firebase: ", error);
        list.innerHTML = "<p class='text-red-400 text-center p-4 bg-red-50 rounded-xl text-sm'>" + error.message + "</p>";
      });
    }

    window.showQR = function(link, imgUrl) { currentQRLink = link; document.getElementById('qrImg').src = imgUrl; document.getElementById('qrLink').innerText = link; document.getElementById('qrModal').classList.remove('hidden'); document.getElementById('qrModal').classList.add('flex'); }
    window.closeQRModal = function() { document.getElementById('qrModal').classList.add('hidden'); }
    window.copyQRLink = function() { navigator.clipboard.writeText(currentQRLink).then(() => alert('¡Link copiado!')); }

    // FIX: ahora guarda Timestamp de Firestore (requerido por las reglas v2 para validar la suscripción)
    window.adjustDays = async function(tagId, days) {
      try {
        const ref = db.collection("tags").doc(tagId);
        const snap = await ref.get();
        let c = snap.data().subscriptionExpires ? expToDate(snap.data().subscriptionExpires) : new Date();
        if (isNaN(c.getTime())) c = new Date();
        if (days !== 0) {
          if(c < new Date()) c = new Date();
          c.setDate(c.getDate() + days);
        }
        await ref.update({ subscriptionExpires: firebase.firestore.Timestamp.fromDate(c) });
        listenTags();
        if (days === 0) alert("🔧 Fecha normalizada al formato nuevo (Timestamp). Si el perfil estaba activo, el dueño ya puede editar; si estaba vencido, dale +30d para activarlo.");
      } catch(e) { alert("Error al ajustar días: " + friendlyError(e)); }
    }
    window.deleteTag = async function(tagId) { if (!confirm("¿Eliminar?")) return; try { await db.collection("tags").doc(tagId).delete(); await db.collection("pets").doc(tagId).delete().catch(()=>{}); listenTags(); } catch(e) { alert("Error al eliminar: " + friendlyError(e)); } }
  </script>
</body>
</html>
