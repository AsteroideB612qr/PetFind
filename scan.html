<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetFind - Mascota Encontrada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-5">
  <div id="content" class="w-full max-w-md">
    <p class="text-gray-400 animate-pulse text-center">Cargando PetFind...</p>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCqX-LAgu49o55vCvvR4h9_VOUBP6e5Tn0",
      authDomain: "petfind-50fb3.firebaseapp.com",
      projectId: "petfind-50fb3",
      storageBucket: "petfind-50fb3.firebasestorage.app",
      messagingSenderId: "1077014067959",
      appId: "1:1077014067959:web:b26d75c1b708b458b971f2"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const urlParams = new URLSearchParams(window.location.search);
    const tagId = urlParams.get('id');

    async function init() {
      if (!tagId) return document.getElementById('content').innerHTML = "<p class='text-red-400 font-bold'>QR inválido.</p>";
      try {
        const docSnap = await db.collection("tags").doc(tagId).get();
        if (!docSnap.exists) return document.getElementById('content').innerHTML = "<p class='text-red-400 font-bold'>Medalla no registrada.</p>";
        const tag = docSnap.data();
        
        if (!tag.claimed) { renderClaimForm(tagId, tag.message); } 
        else {
          const isActive = tag.subscriptionExpires && new Date(tag.subscriptionExpires) > new Date();
          if(!isActive) { renderDisabledProfile(); return; }
          const petSnap = await db.collection("pets").doc(tagId).get();
          if (petSnap.exists) {
            const petData = petSnap.data();
            renderPublicProfile(petData, petData.ownerPhone || tag.phone, tag.message);
          } else { renderPublicProfile({name: "Mascota"}, tag.phone, tag.message); }
        }
      } catch (error) { document.getElementById('content').innerHTML = `<p class='text-red-400'>Error: ${error.message}</p>`; }
    }

    function renderClaimForm(tagId, message) {
      document.getElementById('content').innerHTML = `
        <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-700">
          <div class="text-center mb-8">
            <div class="w-20 h-20 bg-blue-600 rounded-full mx-auto flex items-center justify-center text-4xl mb-4">👑</div>
            <h1 class="text-3xl font-extrabold text-white">Activar Perfil Premium</h1>
          </div>
          <div class="space-y-4">
            <input type="email" id="regEmail" placeholder="Tu correo" class="w-full p-4 bg-slate-700 rounded-xl">
            <input type="password" id="regPass" placeholder="Contraseña" class="w-full p-4 bg-slate-700 rounded-xl">
            <div class="flex gap-2">
              <select id="regCountry" class="w-1/3 p-4 bg-slate-700 rounded-xl">
                <option value="51">🇵🇪 +51</option><option value="52">🇲🇽 +52</option><option value="57">🇨🇴 +57</option><option value="54">🇦🇷 +54</option><option value="56">🇨🇱 +56</option><option value="34">🇪🇸 +34</option><option value="1">🇺🇸 +1</option>
              </select>
              <input type="text" id="regPhone" placeholder="Número" class="w-2/3 p-4 bg-slate-700 rounded-xl">
            </div>
            <button onclick="claimProfile('${tagId}', '${message}')" class="w-full bg-blue-600 px-6 py-4 rounded-xl font-bold">Reclamar Perfil</button>
          </div>
        </div>`;
    }

    window.claimProfile = async function(tagId, message) {
      const email = document.getElementById('regEmail').value, pass = document.getElementById('regPass').value;
      const phone = document.getElementById('regCountry').value + document.getElementById('regPhone').value;
      if(!document.getElementById('regPhone').value) return alert("Ingresa tu número.");
      try {
        let userId;
        try { userId = (await auth.createUserWithEmailAndPassword(email, pass)).user.uid; } 
        catch (err) { if (err.code === 'auth/email-already-in-use') { userId = (await auth.signInWithEmailAndPassword(email, pass)).user.uid; } else { throw err; } }
        await db.collection("tags").doc(tagId).update({ claimed: true, ownerId: userId, phone });
        const petRef = db.collection("pets").doc(tagId);
        if (!(await petRef.get()).exists) { await petRef.set({ name: "Nombre", description: "Cuéntanos...", photoUrl: "", medicalAlerts: "", ownerPhone: phone, defaultMessage: message }); }
        window.location.href = `dashboard.html?id=${tagId}`;
      } catch (error) { alert("Error: " + error.message); }
    }

    function renderPublicProfile(pet, phone, message) {
      let hasPending = pet.events && pet.events.length > 0 && pet.events.some(ev => ev.status === 'Pendiente');
      document.getElementById('content').innerHTML = `
        <div class="bg-slate-800 rounded-3xl shadow-2xl overflow-hidden border border-slate-700">
          <div class="relative h-64 bg-slate-700">
            ${pet.photoUrl ? `<img src="${pet.photoUrl}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-6xl">🐾</div>`}
            <div class="absolute inset-0 bg-gradient-to-t from-slate-900 to-transparent"></div>
            <h1 class="absolute bottom-4 left-6 text-4xl font-extrabold text-white">${pet.name || 'Mascota'}</h1>
          </div>
          <div class="p-6 space-y-6">
            ${pet.medicalAlerts ? `<div class="bg-red-500/20 border border-red-500 rounded-xl p-4 flex gap-3"><span class="text-2xl">⚠️</span><div><h3 class="font-bold text-red-400">Alerta Médica</h3><p class="text-sm text-red-200">${pet.medicalAlerts}</p></div></div>` : ''}
            <p class="text-slate-300">${pet.description || ''}</p>
            ${hasPending ? `<div class="bg-yellow-500/20 border border-yellow-500 rounded-xl p-4 flex gap-3 animate-pulse"><span class="text-2xl">🔔</span><div><h3 class="font-bold text-yellow-400">Eventos pendientes</h3><p class="text-sm text-yellow-200">Revisa el calendario en tu panel.</p></div></div>` : ''}
            <button onclick="sendLocation('${phone}', '${message}')" class="w-full bg-green-500 px-6 py-4 rounded-xl font-bold text-lg">📍 Enviar mi Ubicación</button>
            <button onclick="sendPlainMessage('${phone}', '${message}')" class="w-full bg-slate-700 px-6 py-3 rounded-xl">💬 Solo enviar un Mensaje</button>
            <div class="text-center pt-4 border-t border-slate-700"><button onclick="showOwnerLogin()" class="text-slate-600 text-xs underline">🔒 Acceso Dueño</button></div>
          </div>
        </div>`;
    }

    function renderDisabledProfile() {
      document.getElementById('content').innerHTML = `
        <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl border border-red-800 text-center">
          <div class="w-20 h-20 bg-red-600 rounded-full mx-auto flex items-center justify-center text-4xl mb-4">⏳</div>
          <h1 class="text-3xl font-extrabold text-white mb-2">Servicio Inhabilitado</h1>
          <p class="text-slate-400 mt-2 mb-6">El plan premium ha expirado. Contacta al soporte o ingresa al panel para renovar.</p>
          <div class="bg-slate-700 p-4 rounded-xl text-left mb-4">
            <p class="text-sm text-slate-300">📧 soporte@petfind.com</p>
          </div>
          <div class="text-center pt-4 border-t border-slate-700 mt-4">
            <button onclick="showOwnerLogin()" class="text-slate-400 hover:text-white text-sm underline transition">🔒 Acceso Dueño (Pagar)</button>
          </div>
        </div>`;
    }

    window.showOwnerLogin = function() {
      document.getElementById('content').innerHTML = `
        <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-700">
          <h2 class="text-2xl font-bold text-white mb-4">Panel del Dueño</h2>
          <div class="space-y-4">
            <input type="email" id="loginEmail" placeholder="Correo" class="w-full p-4 bg-slate-700 rounded-xl">
            <input type="password" id="loginPass" placeholder="Contraseña" class="w-full p-4 bg-slate-700 rounded-xl">
            <button onclick="loginOwner()" class="w-full bg-blue-600 px-6 py-4 rounded-xl font-bold">Iniciar Sesión</button>
            <button onclick="history.back()" class="w-full text-slate-500 text-sm">Volver</button>
          </div>
        </div>`;
    }

    window.loginOwner = async function() {
      try { await auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value); window.location.href = `dashboard.html?id=${tagId}`; } 
      catch (e) { alert("Error: " + e.message); }
    }

    window.sendLocation = function(phone, message) {
      if (!navigator.geolocation) return alert("Ubicación no soportada.");
      document.getElementById('content').innerHTML = "<p class='text-blue-400 animate-pulse text-center text-lg'>Obteniendo ubicación...</p>";
      navigator.geolocation.getCurrentPosition(
        (pos) => window.location.href = `https://wa.me/${phone}?text=${encodeURIComponent(message + " https://www.google.com/maps?q=" + pos.coords.latitude + "," + pos.coords.longitude)}`,
        () => window.location.href = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`
      );
    }
    window.sendPlainMessage = function(phone, message) { window.location.href = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`; }
    init();
  </script>
</body>
</html>
