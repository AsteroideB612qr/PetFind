<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetFind - Mascota Encontrada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-5">
  <div id="content" class="w-full max-w-md">
    <p class="text-gray-400 animate-pulse text-center">Cargando PetFind...</p>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCqX-LAgu49o55vCvvR4h9_VOUBP6e5Tn0", authDomain: "petfind-50fb3.firebaseapp.com",
      projectId: "petfind-50fb3", storageBucket: "petfind-50fb3.firebasestorage.app",
      messagingSenderId: "1077014067959", appId: "1:1077014067959:web:b26d75c1b708b458b971f2"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const urlParams = new URLSearchParams(window.location.search);
    const tagId = urlParams.get('id');
    const isDemo = urlParams.get('demo') === 'true';
    let globalSettings = {};

    const demoData = {
      pet: {
        name: "Max", species: "Perro", breed: "Golden Retriever", sex: "Macho", birthDate: "2022-05-10",
        weight: "28 kg", color: "Dorado", sterilized: "Sí", vaccines: "Rabia, Parvovirus", lastDeworming: "2024-03-15",
        showName: true, showPhoto: true, showSpecies: true, showBreed: true, showSex: true, showBirthDate: false,
        showAge: true, showWeight: true, showDiet: false, showColor: true, showSterilized: true, showVaccines: true,
        showDeworming: true, showDescription: true, showMedicalAlerts: true,
        description: "Soy Max, muy sociable y juguetón. Me encanta perseguir pelotas. Si me encuentras, por favor contacta a mi dueño.",
        medicalAlerts: "Alergia al pollo. No dar comida de la calle.",
        photoUrl: "https://images.unsplash.com/photo-1633722715537-4e89c6bce2f1?q=80&w=600&auto=format&fit=crop",
        ownerPhone: "51987654321", events: [{ status: "Pendiente" }]
      }
    };

    function calculateAge(birthDate) {
      if (!birthDate) return null;
      const bDate = new Date(birthDate);
      const now = new Date();
      let age = now.getFullYear() - bDate.getFullYear();
      const m = now.getMonth() - bDate.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < bDate.getDate())) age--;
      if (age <= 0) { const months = (now.getFullYear() - bDate.getFullYear()) * 12 + (now.getMonth() - bDate.getMonth()); return months <= 1 ? `${months} mes` : `${months} meses`; }
      return age === 1 ? `${age} año` : `${age} años`;
    }

    async function init() {
      if (isDemo) {
        renderPublicProfile(demoData.pet, demoData.pet.ownerPhone, "¡Hola! Encontré a tu mascota. Te escribo desde PetFind:");
        return;
      }

      const settingsSnap = await db.collection("settings").doc("payment").get();
      if(settingsSnap.exists) globalSettings = settingsSnap.data();
      if (!tagId) return document.getElementById('content').innerHTML = "<p class='text-red-400 font-bold'>QR inválido.</p>";
      try {
        const docSnap = await db.collection("tags").doc(tagId).get();
        if (!docSnap.exists) return document.getElementById('content').innerHTML = "<p class='text-red-400 font-bold'>Medalla no registrada.</p>";
        const tag = docSnap.data();
        if (!tag.claimed) { renderClaimForm(tagId, tag.message); } 
        else {
          const isActive = tag.subscriptionExpires && new Date(tag.subscriptionExpires) > new Date();
          if(!isActive) { renderDisabledProfile(); return; }
          const petSnap = await db.collection("pets").doc(tagId).get();
          if (petSnap.exists) { renderPublicProfile(petSnap.data(), petSnap.data().ownerPhone || tag.phone, tag.message); } 
          else { renderPublicProfile({name: "Mascota"}, tag.phone, tag.message); }
        }
      } catch (error) { document.getElementById('content').innerHTML = `<p class='text-red-400'>Error: ${error.message}</p>`; }
    }

    function renderPublicProfile(pet, phone, message) {
      let hasPending = pet.events && pet.events.length > 0 && pet.events.some(ev => ev.status === 'Pendiente');
      let infoChips = [];
      if (pet.showSpecies && pet.species) infoChips.push({ icon: '🐾', text: pet.species });
      if (pet.showBreed && pet.breed) infoChips.push({ icon: '🏷️', text: pet.breed });
      if (pet.showSex && pet.sex) infoChips.push({ icon: pet.sex === 'Macho' ? '♂️' : '♀️', text: pet.sex });
      if (pet.showAge && pet.birthDate) { const age = calculateAge(pet.birthDate); if (age) infoChips.push({ icon: '🎂', text: age }); }
      if (pet.showBirthDate && pet.birthDate) infoChips.push({ icon: '📅', text: new Date(pet.birthDate).toLocaleDateString() });
      if (pet.showWeight && pet.weight) infoChips.push({ icon: '⚖️', text: pet.weight });
      if (pet.showDiet && pet.diet) infoChips.push({ icon: '🍖', text: pet.diet });
      if (pet.showColor && pet.color) infoChips.push({ icon: '🎨', text: pet.color });
      if (pet.showSterilized && pet.sterilized) infoChips.push({ icon: '🏥', text: `Esterilizado: ${pet.sterilized}` });
      if (pet.showVaccines && pet.vaccines) infoChips.push({ icon: '💉', text: `Vacunas: ${pet.vaccines}` });
      if (pet.showDeworming && pet.lastDeworming) infoChips.push({ icon: '💊', text: `Desparasitado: ${new Date(pet.lastDeworming).toLocaleDateString()}` });

      const chipsHTML = infoChips.length > 0 ? `<div class="flex flex-wrap justify-center gap-2 mt-3 mb-4">${infoChips.map(c => `<span class="bg-slate-700 text-slate-200 text-xs font-medium px-3 py-1 rounded-full">${c.icon} ${c.text}</span>`).join('')}</div>` : '';

      const showPhoto = pet.showPhoto !== false;
      const showName = pet.showName !== false;
      const photoHTML = showPhoto && pet.photoUrl ? `<img src="${pet.photoUrl}" class="w-32 h-32 rounded-full object-cover border-4 border-slate-800 shadow-lg mb-2">` : `<div class="w-32 h-32 rounded-full bg-slate-700 border-4 border-slate-800 flex items-center justify-center text-5xl mb-2">🐾</div>`;
      const nameHTML = showName ? `<h1 class="text-3xl font-extrabold text-white text-center">${pet.name || 'Mascota'}</h1>` : `<h1 class="text-2xl font-extrabold text-slate-400 text-center">Mascota Encontrada</h1>`;
      const descHTML = pet.showDescription !== false && pet.description ? `<div class="border-t border-slate-700 pt-4"><p class="text-slate-300 leading-relaxed text-center">${pet.description}</p></div>` : '';
      const medHTML = pet.showMedicalAlerts !== false && pet.medicalAlerts ? `<div class="bg-red-500/20 border border-red-500 rounded-xl p-4 flex gap-3"><span class="text-2xl">⚠️</span><div><h3 class="font-bold text-red-400">Alerta Médica</h3><p class="text-sm text-red-200">${pet.medicalAlerts}</p></div></div>` : '';

      const demoAlert = isDemo ? `<div class="bg-green-500/20 border border-green-500 rounded-xl p-3 text-center mb-4 text-sm text-green-300">🧪 Estás viendo un perfil de Demostración. El dueño vería esto al escanear el QR.</div>` : '';

      document.getElementById('content').innerHTML = `
        <div class="flex justify-center mb-4"><img src="logo.png" alt="PetFind" class="h-16"></div>
        ${demoAlert}
        <div class="bg-slate-800 rounded-3xl shadow-2xl overflow-hidden border border-slate-700">
          <div class="h-24 bg-gradient-to-b from-slate-700 to-slate-800"></div>
          <div class="px-6 pb-6 -mt-12 flex flex-col items-center">${photoHTML}${nameHTML}${chipsHTML}</div>
          <div class="p-6 pt-0 space-y-6">
            <div class="space-y-3 pt-2">
              <button onclick="sendLocation('${phone}', '${message}')" class="w-full bg-green-500 px-6 py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2">📍 Enviar mi Ubicación</button>
              <button onclick="sendPlainMessage('${phone}', '${message}')" class="w-full bg-slate-700 px-6 py-3 rounded-xl font-medium">💬 Enviar un Mensaje</button>
            </div>
            ${descHTML}${medHTML}
            ${hasPending ? `<div class="bg-yellow-500/20 border border-yellow-500 rounded-xl p-4 flex gap-3 animate-pulse"><span class="text-2xl">🔔</span><div><h3 class="font-bold text-yellow-400">Eventos pendientes</h3><p class="text-sm text-yellow-200">Revisa el calendario en tu panel.</p></div></div>` : ''}
            <a href="${isDemo ? 'landing.html' : '#'}" target="_blank" class="w-full bg-blue-500 text-white px-6 py-3 rounded-xl font-medium text-center block">🛍️ Comprar esta Medalla</a>
            <div class="text-center pt-4 border-t border-slate-700"><button onclick="showOwnerLogin()" class="text-slate-600 text-xs underline">🔒 Acceso Dueño</button></div>
          </div>
        </div>`;
    }

    function renderDisabledProfile() {
      document.getElementById('content').innerHTML = `<div class="flex justify-center mb-4"><img src="logo.png" alt="PetFind" class="h-16"></div><div class="bg-slate-800 p-8 rounded-3xl shadow-2xl border border-red-800 text-center"><div class="w-20 h-20 bg-red-600 rounded-full mx-auto flex items-center justify-center text-4xl mb-4">⏳</div><h1 class="text-3xl font-extrabold text-white mb-2">Servicio Inhabilitado</h1><p class="text-slate-400 mt-2 mb-6">El plan premium ha expirado. Contacta al soporte o ingresa al panel para renovar.</p><div class="bg-slate-700 p-4 rounded-xl text-left mb-4 space-y-2"><p class="text-sm text-slate-300">📧 ${globalSettings.supportEmail || 'soporte@petfind.com'}</p><a href="${globalSettings.petfindWhatsapp ? `https://wa.me/${globalSettings.petfindWhatsapp}` : '#'}" target="_blank" class="text-sm text-green-400 underline block">💬 WhatsApp de PetFind</a></div><div class="text-center pt-4 border-t border-slate-700 mt-4"><button onclick="showOwnerLogin()" class="text-slate-400 hover:text-white text-sm underline transition">🔒 Acceso Dueño (Pagar)</button></div></div>`;
    }

    function showOwnerLogin() {
      if(isDemo) { window.location.href = 'dashboard.html?demo=true'; return; }
      document.getElementById('content').innerHTML = `<div class="flex justify-center mb-6"><img src="logo.png" alt="PetFind" class="h-20"></div><div class="bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-700"><h2 class="text-2xl font-bold text-white mb-4">Panel del Dueño</h2><div class="space-y-4"><input type="email" id="loginEmail" placeholder="Correo" class="w-full p-4 bg-slate-700 rounded-xl"><input type="password" id="loginPass" placeholder="Contraseña" class="w-full p-4 bg-slate-700 rounded-xl"><button onclick="loginOwner()" class="w-full bg-blue-600 px-6 py-4 rounded-xl font-bold">Iniciar Sesión</button><button onclick="history.back()" class="w-full text-slate-500 text-sm">Volver</button></div></div>`;
    }
    window.showOwnerLogin = showOwnerLogin;

    window.loginOwner = async function() { try { await auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value); window.location.href = `dashboard.html?id=${tagId}`; } catch (e) { alert("Error: " + e.message); } }
    window.sendLocation = function(phone, message) { 
      if(isDemo) return alert("🧪 Demostración: Aquí el rescatista le daría permiso de ubicación y se abriría WhatsApp con el mensaje y la ubicación exacta para enviártela a ti (el dueño).");
      if (!navigator.geolocation) return alert("Ubicación no soportada."); document.getElementById('content').innerHTML = "<p class='text-blue-400 animate-pulse text-center text-lg'>Obteniendo ubicación...</p>"; navigator.geolocation.getCurrentPosition((pos) => window.location.href = `https://wa.me/${phone}?text=${encodeURIComponent(message + " https://www.google.com/maps?q=" + pos.coords.latitude + "," + pos.coords.longitude)}`, () => window.location.href = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`); 
    }
    window.sendPlainMessage = function(phone, message) { 
      if(isDemo) return alert("🧪 Demostración: Esto abriría WhatsApp directamente para contactarte sin enviar ubicación.");
      window.location.href = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`; 
    }
    init();
  </script>
</body>
</html>
