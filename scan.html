<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetFind - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="content" class="max-w-3xl mx-auto p-5">
    <p class="text-gray-500 text-center animate-pulse mt-20">Cargando tu panel privado...</p>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCqX-LAgu49o55vCvvR4h9_VOUBP6e5Tn0",
      authDomain: "petfind-50fb3.firebaseapp.com",
      projectId: "petfind-50fb3",
      storageBucket: "petfind-50fb3.firebasestorage.app",
      messagingSenderId: "1077014067959",
      appId: "1:1077014067959:web:b26d75c1b708b458b971f2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const urlParams = new URLSearchParams(window.location.search);
    const tagId = urlParams.get('id');
    let petState = {};
    let tagState = {};

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        document.getElementById('content').innerHTML = `<div class="text-center mt-20"><p class="text-xl text-gray-600 mb-4">Debes iniciar sesión.</p><a href="scan.html?id=${tagId}" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold">Volver</a></div>`;
        return;
      }
      const petSnap = await db.collection("pets").doc(tagId).get();
      const tagSnap = await db.collection("tags").doc(tagId).get();
      if (petSnap.exists && tagSnap.exists) {
        petState = petSnap.data();
        tagState = tagSnap.data();
        if(!petState.events) petState.events = [];
        renderDashboard();
      } else {
        document.getElementById('content').innerHTML = "<p class='text-red-500 text-center mt-20'>Perfil no encontrado.</p>";
      }
    });

    function renderDashboard() {
      const expDate = tagState.subscriptionExpires ? new Date(tagState.subscriptionExpires) : null;
      const isActive = expDate && expDate > new Date();
      const subText = isActive ? `Activo hasta ${expDate.toLocaleDateString()}` : "Pendiente / Vencido";
      const subColor = isActive ? "bg-green-100 text-green-700" : "bg-red-100 text-red-700";
      const currentCountry = (petState.ownerPhone || "").substring(0, 2);
      const currentPhone = (petState.ownerPhone || "").substring(2);

      document.getElementById('content').innerHTML = `
        <div class="flex items-center justify-between mb-8 pt-8">
          <div class="flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" /></svg>
            <h1 class="text-3xl font-extrabold text-slate-800">Panel Premium</h1>
          </div>
          <button onclick="auth.signOut()" class="text-gray-500 hover:text-red-500 text-sm font-medium">Cerrar Sesión</button>
        </div>

        <!-- SUSCRIPCIÓN -->
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden mb-6">
          <div class="p-6 bg-gradient-to-r from-yellow-500 to-orange-600 text-white flex justify-between items-center">
            <h2 class="text-xl font-bold">👑 Membresía PetFind</h2>
            <span class="text-sm bg-white/20 px-3 py-1 rounded-full">${subText}</span>
          </div>
          <div class="p-6 space-y-4">
            ${!isActive ? `
              <div class="text-center space-y-3">
                <p class="text-gray-600 font-medium">Para mantener el perfil activo, realiza el pago de S/ 15.00 (o tu moneda local) a la siguiente cuenta:</p>
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                  <p class="text-xl font-bold text-slate-800">Yape / Plin: 984908819</p>
                  <p class="text-sm text-gray-500">A nombre de: Tu Nombre</p>
                </div>
                <p class="text-gray-600">Sube el captura del recibo y solicita activación:</p>
                
                <input type="file" id="voucherFile" accept="image/*" class="hidden" onchange="handleVoucherSelect(event)">
                <button onclick="document.getElementById('voucherFile').click()" class="w-full bg-yellow-100 text-yellow-700 px-4 py-3 rounded-xl font-medium hover:bg-yellow-200">🧾 Adjuntar Recibo</button>
                <button onclick="submitVoucher()" class="w-full bg-orange-600 text-white px-6 py-3 rounded-xl font-bold shadow-md hover:bg-orange-700">Solicitar Activación</button>
              </div>
            ` : `<p class="text-green-600 font-bold text-center">¡Tu mascota está protegida! Gracias por tu pago.</p>`}
          </div>
        </div>

        <!-- PERFIL PÚBLICO -->
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden mb-6">
          <div class="p-6 bg-gradient-to-r from-blue-600 to-indigo-700 text-white"><h2 class="text-xl font-bold">Perfil de la Mascota</h2></div>
          <div class="p-6 space-y-5">
            <div class="flex flex-col items-center mb-4">
              <img id="imgPreview" src="${petState.photoUrl || 'https://via.placeholder.com/150'}" alt="Foto" class="w-32 h-32 rounded-full object-cover shadow-lg mb-2 border-4 border-white">
              <input type="file" id="photoFile" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
              <button onclick="document.getElementById('photoFile').click()" class="bg-blue-100 text-blue-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-200 transition">📸 Subir Foto</button>
            </div>
            <div><label class="block text-gray-700 font-medium mb-1">Nombre</label><input type="text" id="petName" value="${petState.name || ''}" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500"></div>
            <div><label class="block text-gray-700 font-medium mb-1">Descripción</label><textarea id="petDesc" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 h-20">${petState.description || ''}</textarea></div>
            <div><label class="block text-gray-700 font-medium mb-1">🚨 Alertas Médicas</label><input type="text" id="petAlerts" value="${petState.medicalAlerts || ''}" placeholder="Ej: Diabético" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500"></div>
            <div><label class="block text-gray-700 font-medium mb-1">WhatsApp</label><div class="flex gap-2"><select id="petCountry" class="w-1/3 p-3 border rounded-xl focus:ring-2 focus:ring-blue-500"><option value="51" ${currentCountry==='51'?'selected':''}>🇵🇪 +51</option><option value="52" ${currentCountry==='52'?'selected':''}>🇲🇽 +52</option><option value="57" ${currentCountry==='57'?'selected':''}>🇨🇴 +57</option><option value="54" ${currentCountry==='54'?'selected':''}>🇦🇷 +54</option><option value="56" ${currentCountry==='56'?'selected':''}>🇨🇱 +56</option><option value="34" ${currentCountry==='34'?'selected':''}>🇪🇸 +34</option><option value="1" ${currentCountry==='1'?'selected':''}>🇺🇸 +1</option></select><input type="text" id="petPhone" value="${currentPhone}" class="w-2/3 p-3 border rounded-xl focus:ring-2 focus:ring-blue-500"></div></div>
            <button onclick="savePublicProfile()" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold shadow-md">💾 Guardar Perfil Público</button>
          </div>
        </div>

        <!-- EXPEDIENTE MÉDICO -->
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden mb-6">
          <div class="p-6 bg-gradient-to-r from-emerald-500 to-teal-600 text-white"><h2 class="text-xl font-bold">📋 Calendario y Expediente Médico</h2></div>
          <div class="p-6 space-y-5">
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
              <h3 class="font-bold text-slate-700 mb-3">➕ Agregar Nuevo Evento</h3>
              <div class="grid grid-cols-2 gap-3">
                <select id="evType" class="p-2 border rounded-lg w-full"><option value="Vacuna">Vacuna</option><option value="Desparasitación">Desparasitación</option><option value="Cita Médica">Cita Médica</option></select>
                <input type="text" id="evName" placeholder="Nombre" class="p-2 border rounded-lg w-full">
                <input type="date" id="evDate" class="p-2 border rounded-lg w-full">
                <select id="evStatus" class="p-2 border rounded-lg w-full"><option value="Pendiente">Pendiente</option><option value="Aplicada">Aplicada</option></select>
              </div>
              <button onclick="addEvent()" class="mt-3 w-full bg-emerald-600 text-white py-2 rounded-lg font-medium hover:bg-emerald-700">Agregar</button>
            </div>
            <div><h3 class="font-bold text-slate-700 mb-3">📅 Historial</h3><div id="eventsList" class="space-y-2"></div></div>
            <div class="pt-4 border-t mt-4"><label class="block text-gray-700 font-medium mb-1">💊 Recetas Médicas</label><textarea id="petRx" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 h-24" placeholder="Medicamentos, dosis...">${petState.rx || ''}</textarea></div>
            <div><label class="block text-gray-700 font-medium mb-1">📝 Notas Privadas</label><textarea id="petNotes" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 h-24" placeholder="Notas...">${petState.notes || ''}</textarea></div>
            <button onclick="saveMedicalProfile()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-bold shadow-md">💾 Guardar Expediente</button>
          </div>
        </div>
        <div class="text-center pb-10"><a href="scan.html?id=${tagId}" target="_blank" class="text-blue-600 underline">Ver mi perfil público</a></div>
      `;
      renderEvents();
    }

    window.addEvent = function() {
      const type = document.getElementById('evType').value; const name = document.getElementById('evName').value; const date = document.getElementById('evDate').value; const status = document.getElementById('evStatus').value;
      if(!name || !date) return alert("Completa nombre y fecha");
      petState.events.push({ type, name, date, status });
      document.getElementById('evName').value = ''; document.getElementById('evDate').value = '';
      renderEvents();
    }

    window.deleteEvent = function(i) { petState.events.splice(i, 1); renderEvents(); }

    window.renderEvents = function() {
      const list = document.getElementById('eventsList');
      if(!petState.events || petState.events.length === 0) return list.innerHTML = "<p class='text-gray-400 text-sm'>No hay eventos.</p>";
      petState.events.sort((a,b) => new Date(b.date) - new Date(a.date));
      list.innerHTML = petState.events.map((ev, i) => {
        const sc = ev.status === 'Pendiente' ? 'bg-yellow-100 text-yellow-800' : 'bg-green-100 text-green-800';
        return `<div class="flex justify-between items-center p-3 bg-white border rounded-lg shadow-sm"><div><span class="text-xs font-bold uppercase text-gray-500">${ev.type}</span><p class="font-bold text-gray-800">${ev.name}</p><p class="text-sm text-gray-500">📅 ${ev.date} - <span class="px-2 py-1 rounded-full text-xs ${sc}">${ev.status}</span></p></div><button onclick="deleteEvent(${i})" class="text-red-500 hover:text-red-700 text-sm">🗑️</button></div>`;
      }).join('');
    }

    window.handleFileSelect = function(event) {
      const file = event.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image(); img.onload = function() {
          const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
          let width = img.width, height = img.height;
          if (width > height) { if (width > 300) { height *= 300 / width; width = 300; } } else { if (height > 300) { width *= 300 / height; height = 300; } }
          canvas.width = width; canvas.height = height; ctx.drawImage(img, 0, 0, width, height);
          const dataURL = canvas.toDataURL('image/jpeg', 0.7);
          document.getElementById('imgPreview').src = dataURL; window.base64Photo = dataURL;
        }; img.src = e.target.result;
      }; reader.readAsDataURL(file);
    };

    // Compresor de Recibo (Voucher)
    window.handleVoucherSelect = function(event) {
      const file = event.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image(); img.onload = function() {
          const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
          let width = img.width, height = img.height;
          if (width > height) { if (width > 600) { height *= 600 / width; width = 600; } } else { if (height > 600) { width *= 600 / height; height = 600; } }
          canvas.width = width; canvas.height = height; ctx.drawImage(img, 0, 0, width, height);
          window.base64Voucher = canvas.toDataURL('image/jpeg', 0.6); // Muy comprimido
          alert("Recibo cargado. Ahora presiona 'Solicitar Activación'.");
        }; img.src = e.target.result;
      }; reader.readAsDataURL(file);
    };

    window.submitVoucher = async function() {
      if(!window.base64Voucher) return alert("Por favor adjunta la imagen del recibo primero.");
      try {
        await db.collection("tags").doc(tagId).update({ voucherUrl: window.base64Voucher });
        alert("¡Recibo enviado! El administrador revisará tu pago y activará tu servicio pronto.");
        window.location.reload();
      } catch(e) { alert("Error: " + e.message); }
    };

    window.savePublicProfile = async function() {
      const cCode = document.getElementById('petCountry').value;
      const pNum = document.getElementById('petPhone').value;
      const phoneVal = cCode + pNum;
      const data = { photoUrl: window.base64Photo || document.getElementById('imgPreview').src, name: document.getElementById('petName').value, description: document.getElementById('petDesc').value, medicalAlerts: document.getElementById('petAlerts').value, ownerPhone: phoneVal };
      try { await db.collection("pets").doc(tagId).update(data); await db.collection("tags").doc(tagId).update({ phone: phoneVal }); alert("¡Perfil guardado y sincronizado!"); } catch (e) { alert("Error: " + e.message); }
    }

    window.saveMedicalProfile = async function() {
      const data = { events: petState.events || [], rx: document.getElementById('petRx').value, notes: document.getElementById('petNotes').value };
      try { await db.collection("pets").doc(tagId).update(data); alert("¡Expediente médico guardado!"); } catch (e) { alert("Error: " + e.message); }
    }
  </script>
</body>
</html>
