<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetFind - Mascota Encontrada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-5">
  <div id="content" class="w-full max-w-md">
    <p class="text-gray-400 animate-pulse text-center">Cargando PetFind...</p>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCqX-LAgu49o55vCvvR4h9_VOUBP6e5Tn0",
      authDomain: "petfind-50fb3.firebaseapp.com",
      projectId: "petfind-50fb3",
      storageBucket: "petfind-50fb3.firebasestorage.app",
      messagingSenderId: "1077014067959",
      appId: "1:1077014067959:web:b26d75c1b708b458b971f2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const urlParams = new URLSearchParams(window.location.search);
    const tagId = urlParams.get('id');

    async function init() {
      if (!tagId) {
        document.getElementById('content').innerHTML = "<p class='text-red-400 font-bold'>QR inválido.</p>";
        return;
      }

      try {
        const docSnap = await db.collection("tags").doc(tagId).get();
        if (!docSnap.exists) {
          document.getElementById('content').innerHTML = "<p class='text-red-400 font-bold'>Medalla no registrada.</p>";
          return;
        }

        const tag = docSnap.data();
        
        if (!tag.claimed) {
          renderClaimForm(tagId, tag.phone, tag.message);
        } else {
          const petSnap = await db.collection("pets").doc(tagId).get();
          if (petSnap.exists) {
            renderPublicProfile(petSnap.data(), tag.phone, tag.message);
          } else {
            renderPublicProfile({name: "Mascota", description: "Perfil en configuración."}, tag.phone, tag.message);
          }
        }
      } catch (error) {
        console.error(error);
        document.getElementById('content').innerHTML = `<p class='text-red-400'>Error: ${error.message}</p>`;
      }
    }

    function renderClaimForm(tagId, phone, message) {
      document.getElementById('content').innerHTML = `
        <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-700">
          <div class="text-center mb-8">
            <div class="w-20 h-20 bg-blue-600 rounded-full mx-auto flex items-center justify-center text-4xl mb-4">👑</div>
            <h1 class="text-3xl font-extrabold text-white">Activar Perfil Premium</h1>
            <p class="text-slate-400 mt-2">Si ya tienes una cuenta, inicia sesión. Si eres nuevo, regístrate.</p>
          </div>
          
          <div class="space-y-4">
            <input type="email" id="regEmail" placeholder="Tu correo electrónico" class="w-full p-4 bg-slate-700 rounded-xl border-none focus:ring-2 focus:ring-blue-500">
            <input type="password" id="regPass" placeholder="Tu contraseña" class="w-full p-4 bg-slate-700 rounded-xl border-none focus:ring-2 focus:ring-blue-500">
            <button onclick="claimProfile('${tagId}', '${phone}', '${message}')" class="w-full bg-blue-600 hover:bg-blue-700 px-6 py-4 rounded-xl font-bold text-lg shadow-lg transition">
              Reclamar Perfil
            </button>
          </div>
        </div>
      `;
    }

    window.claimProfile = async function(tagId, phone, message) {
      const email = document.getElementById('regEmail').value;
      const pass = document.getElementById('regPass').value;
      
      try {
        let userId;
        
        // Intentar registrar
        try {
          const userCred = await auth.createUserWithEmailAndPassword(email, pass);
          userId = userCred.user.uid;
        } catch (err) {
          // Si el error es que el correo ya existe, INICIAR SESIÓN
          if (err.code === 'auth/email-already-in-use') {
            const userCred = await auth.signInWithEmailAndPassword(email, pass);
            userId = userCred.user.uid;
          } else {
            throw err; // Si es otro error (ej: contraseña débil), lanzarlo
          }
        }
        
        // Marcar medalla como reclamada
        await db.collection("tags").doc(tagId).update({ claimed: true, ownerId: userId });
        
        // Crear perfil de mascota si no existe
        const petRef = db.collection("pets").doc(tagId);
        const petSnap = await petRef.get();
        if (!petSnap.exists) {
          await petRef.set({
            name: "Nombre de tu mascota",
            description: "Cuéntanos sobre tu mascota...",
            photoUrl: "",
            medicalAlerts: "",
            ownerPhone: phone,
            defaultMessage: message
          });
        }

        // Redirigir al panel
        window.location.href = `dashboard.html?id=${tagId}`;
      } catch (error) {
        alert("Error: " + error.message);
      }
    }

    function renderPublicProfile(pet, phone, message) {
      document.getElementById('content').innerHTML = `
        <div class="bg-slate-800 rounded-3xl shadow-2xl overflow-hidden border border-slate-700">
          <div class="relative h-64 bg-slate-700">
            ${pet.photoUrl ? 
              `<img src="${pet.photoUrl}" alt="${pet.name}" class="w-full h-full object-cover">` : 
              `<div class="w-full h-full flex items-center justify-center text-6xl">🐾</div>`
            }
            <div class="absolute inset-0 bg-gradient-to-t from-slate-900 to-transparent"></div>
            <h1 class="absolute bottom-4 left-6 text-4xl font-extrabold text-white drop-shadow-lg">${pet.name || 'Mascota'}</h1>
          </div>

          <div class="p-6 space-y-6">
            ${pet.medicalAlerts ? `
              <div class="bg-red-500/20 border border-red-500 rounded-xl p-4 flex items-start gap-3">
                <span class="text-2xl">⚠️</span>
                <div>
                  <h3 class="font-bold text-red-400">Alerta Médica</h3>
                  <p class="text-sm text-red-200">${pet.medicalAlerts}</p>
                </div>
              </div>
            ` : ''}

            <div>
              <p class="text-slate-300 leading-relaxed">${pet.description || 'Sin descripción.'}</p>
            </div>

            <div class="space-y-3 pt-2">
              <button onclick="sendLocation('${phone}', '${message}')" class="w-full bg-green-500 hover:bg-green-600 text-white px-6 py-4 rounded-xl font-bold text-lg shadow-md flex items-center justify-center gap-2 transition">
                <span>📍</span> Enviar mi Ubicación
              </button>
              <button onclick="sendPlainMessage('${phone}', '${message}')" class="w-full bg-slate-700 hover:bg-slate-600 text-white px-6 py-3 rounded-xl font-medium text-md transition">
                💬 Solo enviar un Mensaje
              </button>
            </div>
          </div>
        </div>
      `;
    }

    window.sendLocation = function(phone, message) {
      if (!navigator.geolocation) return alert("Ubicación no soportada.");
      document.getElementById('content').innerHTML = "<p class='text-blue-400 animate-pulse text-center text-lg'>Obteniendo ubicación...</p>";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const link = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
          window.location.href = `https://wa.me/${phone}?text=${encodeURIComponent(message + " Mi ubicación es: " + link)}`;
        },
        () => window.location.href = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`
      );
    }

    window.sendPlainMessage = function(phone, message) {
      window.location.href = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
    }

    init();
  </script>
</body>
</html>
