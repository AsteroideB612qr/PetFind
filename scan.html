<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>ChochePet - Mascota Encontrada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-5">
  <div id="content" class="w-full max-w-md">
    <p class="text-gray-400 animate-pulse text-center">Cargando ChochePet...</p>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCqX-LAgu49o55vCvvR4h9_VOUBP6e5Tn0", authDomain: "petfind-50fb3.firebaseapp.com",
      projectId: "petfind-50fb3", storageBucket: "petfind-50fb3.firebasestorage.app",
      messagingSenderId: "1077014067959", appId: "1:1077014067959:web:b26d75c1b708b458b971f2"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const urlParams = new URLSearchParams(window.location.search);
    const tagId = urlParams.get('id');
    const isDemo = urlParams.get('demo') === 'true';
    let globalSettings = {};

    const demoData = {
      pet: {
        name: "Max", species: "Perro", breed: "Golden Retriever", sex: "Macho", birthDate: "2022-05-10",
        weight: "28 kg", color: "Dorado", sterilized: "Sí", vaccines: "Rabia, Parvovirus", lastDeworming: "2024-03-15",
        vetName: "Dr. VetDemo", vetPhone: "51987654321", showVet: true,
        showName: true, showPhoto: true, showSpecies: true, showBreed: true, showSex: true, showBirthDate: false,
        showAge: true, showWeight: true, showDiet: false, showColor: true, showSterilized: true, showVaccines: true,
        showDeworming: true, showDescription: true, showMedicalAlerts: true,
        description: "Soy Max, muy sociable y juguetón. Me encanta perseguir pelotas. Si me encuentras, por favor contacta a mi dueño.",
        medicalAlerts: "Alergia al pollo. No dar comida de la calle.",
        photoUrl: "https://images.unsplash.com/photo-1633722715537-4e89c6bce2f1?q=80&w=600&auto=format&fit=crop",
        ownerPhone: "51987654321", events: [{ status: "Pendiente" }]
      }
    };

    // Convierte a Date aceptando Timestamp de Firestore O string ISO (compatibilidad con datos antiguos)
    function expToDate(v) { if (!v) return null; return v.seconds ? new Date(v.seconds * 1000) : new Date(v); }

    function calculateAge(birthDate) {
      if (!birthDate) return null;
      const bDate = new Date(birthDate), now = new Date();
      let age = now.getFullYear() - bDate.getFullYear();
      const m = now.getMonth() - bDate.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < bDate.getDate())) age--;
      if (age <= 0) { const months = (now.getFullYear() - bDate.getFullYear()) * 12 + (now.getMonth() - bDate.getMonth()); return months <= 1 ? `${months} mes` : `${months} meses`; }
      return age === 1 ? `${age} año` : `${age} años`;
    }

    async function init() {
      try { const settingsSnap = await db.collection("settings").doc("payment").get(); if (settingsSnap.exists) globalSettings = settingsSnap.data(); } catch (e) {}
      if (isDemo) { renderPublicProfile(demoData.pet, demoData.pet.ownerPhone, "¡Hola! Encontré a tu mascota:"); return; }
      if (!tagId) return document.getElementById('content').innerHTML = "<p class='text-red-400 font-bold'>QR inválido.</p>";
      try {
        const docSnap = await db.collection("tags").doc(tagId).get();
        if (!docSnap.exists) return document.getElementById('content').innerHTML = "<p class='text-red-400 font-bold'>Medalla no registrada.</p>";
        const tag = docSnap.data();
        if (tag.plan === 'basic') { window.location.href = `go.html?id=${tagId}`; return; }
        if (!tag.claimed) { renderClaimForm(tagId, tag.message); } 
        else {
          const isActive = tag.subscriptionExpires && expToDate(tag.subscriptionExpires) > new Date();
          if(!isActive) { renderDisabledProfile(); return; }
          const petSnap = await db.collection("pets").doc(tagId).get();
          if (petSnap.exists) { updatePWA(petSnap.data().name || "ChochePet", petSnap.data().photoUrl); renderPublicProfile(petSnap.data(), petSnap.data().ownerPhone || tag.phone, tag.message); } 
          else { renderPublicProfile({name: "Mascota"}, tag.phone, tag.message); }
        }
      } catch (error) { document.getElementById('content').innerHTML = `<p class='text-red-400'>Error: ${error.message}</p>`; }
    }

    function updatePWA(name, iconUrl) {
      const manifest = { name: name, short_name: name, display: "standalone", start_url: window.location.href, icons: [{ src: iconUrl || "logo.png", sizes: "192x192", type: "image/jpeg" }] };
      const stringManifest = JSON.stringify(manifest); const blob = new Blob([stringManifest], {type: 'application/json'}); const manifestURL = URL.createObjectURL(blob);
      let mLink = document.querySelector('link[rel="manifest"]'); if (!mLink) { mLink = document.createElement('link'); mLink.rel = 'manifest'; document.head.appendChild(mLink); } mLink.href = manifestURL;
      let aLink = document.querySelector('link[rel="apple-touch-icon"]'); if (!aLink) { aLink = document.createElement('link'); aLink.rel = 'apple-touch-icon'; document.head.appendChild(aLink); } aLink.href = iconUrl || "logo.png";
    }

    function renderPublicProfile(pet, phone, message) {
      let hasPending = pet.events && pet.events.length > 0 && pet.events.some(ev => ev.status === 'Pendiente');
      let infoChips = [];
      if (pet.showSpecies && pet.species) infoChips.push({ icon: '🐾', text: pet.species });
      if (pet.showBreed && pet.breed) infoChips.push({ icon: '🏷️', text: pet.breed });
      if (pet.showSex && pet.sex) infoChips.push({ icon: pet.sex === 'Macho' ? '♂️' : '♀️', text: pet.sex });
      if (pet.showAge && pet.birthDate) { const age = calculateAge(pet.birthDate); if (age) infoChips.push({ icon: '🎂', text: age }); }
      if (pet.showWeight && pet.weight) infoChips.push({ icon: '⚖️', text: pet.weight });
      if (pet.showColor && pet.color) infoChips.push({ icon: '🎨', text: pet.color });
      if (pet.showSterilized && pet.sterilized) infoChips.push({ icon: '🏥', text: `Esterilizado: ${pet.sterilized}` });
      if (pet.showVaccines && pet.vaccines) infoChips.push({ icon: '💉', text: `Vacunas: ${pet.vaccines}` });
      if (pet.showDeworming && pet.lastDeworming) infoChips.push({ icon: '💊', text: `Desp: ${new Date(pet.lastDeworming).toLocaleDateString()}` });

      const chipsHTML = infoChips.length > 0 ? `<div class="flex flex-wrap justify-center gap-2 mt-3 mb-4">${infoChips.map(c => `<span class="bg-slate-700 text-slate-200 text-xs font-medium px-3 py-1 rounded-full">${c.icon} ${c.text}</span>`).join('')}</div>` : '';
      const showPhoto = pet.showPhoto !== false, showName = pet.showName !== false, showDescription = pet.showDescription !== false, showMedicalAlerts = pet.showMedicalAlerts !== false;
      const photoHTML = showPhoto && pet.photoUrl ? `<img src="${pet.photoUrl}" class="w-32 h-32 rounded-full object-cover border-4 border-slate-800 shadow-lg mb-2">` : `<div class="w-32 h-32 rounded-full bg-slate-700 border-4 border-slate-800 flex items-center justify-center text-5xl mb-2">🐾</div>`;
      const nameHTML = showName ? `<h1 class="text-3xl font-extrabold text-white text-center">${pet.name || 'Mascota'}</h1>` : `<h1 class="text-2xl font-extrabold text-slate-400 text-center">Mascota Encontrada</h1>`;
      
      const descHTML = showDescription && pet.description ? `<div class="bg-slate-700/50 rounded-xl p-4"><p class="text-slate-300 leading-relaxed text-center text-sm">${pet.description}</p></div>` : '';
      const medHTML = showMedicalAlerts && pet.medicalAlerts ? `<div class="bg-red-500/10 border border-red-500/30 rounded-xl p-4 flex gap-3"><span class="text-2xl">⚠️</span><div><h3 class="font-bold text-red-400 text-sm">Alerta Médica</h3><p class="text-sm text-red-200">${pet.medicalAlerts}</p></div></div>` : '';
      
      // Lógica de Veterinario: Solo se muestra si showVet es true, y tiene nombre y teléfono
      const vetHTML = (pet.showVet && pet.vetName && pet.vetPhone) ? `
        <div class="bg-green-500/10 border border-green-500/30 rounded-xl p-4 flex justify-between items-center">
          <div><h3 class="font-bold text-green-400 text-sm">👨‍⚕️ Veterinario</h3><p class="text-sm text-green-200">${pet.vetName}</p></div>
          <button onclick="sendProfileToVet('${pet.vetPhone}', '${pet.name||'Mascota'}', '${pet.species||''}', '${pet.breed||''}', '${pet.medicalAlerts||'Ninguna'}')" class="bg-green-500 text-white px-4 py-2 rounded-lg text-sm font-bold">Enviar Perfil</button>
        </div>` : '';

      const demoAlert = isDemo ? `<div class="bg-green-500/20 border border-green-500 rounded-xl p-3 text-center mb-4 text-sm text-green-300">🧪 Perfil de Demostración.</div>` : '';

      document.getElementById('content').innerHTML = `
        <div class="flex justify-center mb-4"><a href="landing.html" target="_blank"><img src="logo.png" alt="ChochePet" class="h-16 cursor-pointer hover:opacity-80 transition"></a></div>
        ${demoAlert}
        <div class="bg-slate-800 rounded-3xl shadow-2xl overflow-hidden border border-slate-700">
          <div class="h-24 bg-gradient-to-b from-slate-700 to-slate-800"></div>
          <div class="px-6 pb-6 -mt-12 flex flex-col items-center">${photoHTML}${nameHTML}${chipsHTML}</div>
          <div class="p-6 pt-0 space-y-4">
            <div class="space-y-3 pt-2">
              <button onclick="sendLocation('${phone}', '${message}')" class="w-full bg-green-500 px-6 py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2">📍 Enviar mi Ubicación</button>
              <button onclick="sendPlainMessage('${phone}', '${message}')" class="w-full bg-slate-700 px-6 py-3 rounded-xl font-medium">💬 Enviar un Mensaje</button>
            </div>
            ${descHTML}
            ${medHTML}
            ${vetHTML}
            ${hasPending ? `<div class="bg-yellow-500/20 border border-yellow-500 rounded-xl p-4 flex gap-3 animate-pulse"><span class="text-2xl">🔔</span><div><h3 class="font-bold text-yellow-400">Eventos pendientes</h3><p class="text-sm text-yellow-200">Revisa el calendario en tu panel.</p></div></div>` : ''}
            <a href="${salesHref()}" target="_blank" class="w-full bg-blue-500 text-white px-6 py-3 rounded-xl font-bold text-center block">🐾¡La quiero!</a>
            <div class="text-center pt-4 border-t border-slate-700"><button onclick="showOwnerLogin()" class="text-slate-600 text-xs underline">🔒 Acceso Dueño</button></div>
          </div>
        </div>`;
    }

    function salesHref() {
      const wa = globalSettings.petfindWhatsapp;
      if (!wa) return 'landing.html';
      const msg = globalSettings.waSalesMsg || 'Hola ChochePet 🐾 Me gustaría información sobre las medallas.';
      return `https://wa.me/${wa}?text=${encodeURIComponent(msg)}`;
    }

    window.sendProfileToVet = function(vetPhone, name, species, breed, alerts) {
      let msg = `Hola, le comparto el perfil de ${name}:\n`;
      if(species) msg += `Especie: ${species}\n`;
      if(breed) msg += `Raza: ${breed}\n`;
      msg += `Alertas: ${alerts}\n`;
      window.open(`https://wa.me/${vetPhone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function renderClaimForm(tagId, message) {
      document.getElementById('content').innerHTML = `
        <div class="flex justify-center mb-6"><a href="landing.html" target="_blank"><img src="logo.png" alt="ChochePet" class="h-20 cursor-pointer"></a></div>
        <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-700"><div class="text-center mb-8"><h1 class="text-3xl font-extrabold text-white">Activar Perfil Premium</h1></div>
          <div class="space-y-4">
            <input type="email" id="regEmail" placeholder="Tu correo" class="w-full p-4 bg-slate-700 rounded-xl"><input type="password" id="regPass" placeholder="Contraseña" class="w-full p-4 bg-slate-700 rounded-xl">
            <div class="flex gap-2"><select id="regCountry" class="w-1/3 p-4 bg-slate-700 rounded-xl"><option value="51">🇵🇪 +51</option><option value="52">🇲🇽 +52</option><option value="57">🇨🇴 +57</option><option value="54">🇦🇷 +54</option><option value="56">🇨🇱 +56</option><option value="34">🇪🇸 +34</option><option value="1">🇺🇸 +1</option></select><input type="text" id="regPhone" placeholder="Número" class="w-2/3 p-4 bg-slate-700 rounded-xl"></div>
            <div class="flex items-start gap-2 text-left"><input type="checkbox" id="acceptTerms" class="w-5 h-5 mt-1 text-blue-600 rounded"><label for="acceptTerms" class="text-xs text-slate-400">He leído y acepto los <a href="terminos.html" target="_blank" class="text-blue-400 underline">Términos</a> y la <a href="privacidad.html" target="_blank" class="text-blue-400 underline">Privacidad</a>.</label></div>
            <button onclick="claimProfile('${tagId}', '${message}')" class="w-full bg-blue-600 px-6 py-4 rounded-xl font-bold">Reclamar Perfil</button>
          </div></div>`;
    }
    window.claimProfile = async function(tagId, message) {
      if(!document.getElementById('acceptTerms').checked) return alert("Debes aceptar los Términos.");
      const email = document.getElementById('regEmail').value, pass = document.getElementById('regPass').value, phone = document.getElementById('regCountry').value + document.getElementById('regPhone').value;
      if(!document.getElementById('regPhone').value) return alert("Ingresa tu número.");
      try {
        let userId; try { userId = (await auth.createUserWithEmailAndPassword(email, pass)).user.uid; } catch (err) { if (err.code === 'auth/email-already-in-use') { userId = (await auth.signInWithEmailAndPassword(email, pass)).user.uid; } else { throw err; } }
        await db.collection("tags").doc(tagId).update({ claimed: true, ownerId: userId, phone });
        const petRef = db.collection("pets").doc(tagId); if (!(await petRef.get()).exists) { await petRef.set({ name: "Nombre", description: "", photoUrl: "", medicalAlerts: "", ownerPhone: phone, defaultMessage: message, prescriptions: [], notesList: [] }); }
        window.location.href = `dashboard.html?id=${tagId}`;
      } catch (error) { alert("Error: " + error.message); }
    }
    function renderDisabledProfile() {
      document.getElementById('content').innerHTML = `<div class="flex justify-center mb-4"><a href="landing.html" target="_blank"><img src="logo.png" alt="ChochePet" class="h-16 cursor-pointer"></a></div><div class="bg-slate-800 p-8 rounded-3xl shadow-2xl border border-red-800 text-center"><div class="w-20 h-20 bg-red-600 rounded-full mx-auto flex items-center justify-center text-4xl mb-4">⏳</div><h1 class="text-3xl font-extrabold text-white mb-2">Servicio Inhabilitado</h1><p class="text-slate-400 mt-2 mb-6">El plan premium ha expirado.</p><div class="bg-slate-700 p-4 rounded-xl text-left mb-4 space-y-2"><p class="text-sm text-slate-300">📧 ${globalSettings.supportEmail || 'soporte@chochepet.com'}</p><a href="${globalSettings.petfindWhatsapp ? `https://wa.me/${globalSettings.petfindWhatsapp}` : '#'}" target="_blank" class="text-sm text-green-400 underline block">💬 WhatsApp</a></div><div class="text-center pt-4 border-t border-slate-700 mt-4"><button onclick="showOwnerLogin()" class="text-slate-400 hover:text-white text-sm underline">🔒 Acceso Dueño (Pagar)</button></div></div>`;
    }
    function showOwnerLogin() { if(isDemo) { window.location.href = 'dashboard.html?demo=true'; return; } document.getElementById('content').innerHTML = `<div class="flex justify-center mb-6"><a href="landing.html" target="_blank"><img src="logo.png" alt="ChochePet" class="h-20 cursor-pointer"></a></div><div class="bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-700"><h2 class="text-2xl font-bold text-white mb-4">Panel del Dueño</h2><div class="space-y-4"><input type="email" id="loginEmail" placeholder="Correo" class="w-full p-4 bg-slate-700 rounded-xl"><input type="password" id="loginPass" placeholder="Contraseña" class="w-full p-4 bg-slate-700 rounded-xl"><button onclick="loginOwner()" class="w-full bg-blue-600 px-6 py-4 rounded-xl font-bold">Iniciar Sesión</button><button onclick="history.back()" class="w-full text-slate-500 text-sm">Volver</button></div></div>`; }
    window.showOwnerLogin = showOwnerLogin;
    window.loginOwner = async function() { try { await auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value); window.location.href = `dashboard.html?id=${tagId}`; } catch (e) { alert("Error: " + e.message); } }
    window.sendLocation = function(phone, message) { if(isDemo) return alert("🧪 Demo: Se abriría WhatsApp con la ubicación."); if (!navigator.geolocation) return alert("Ubicación no soportada."); document.getElementById('content').innerHTML = "<p class='text-blue-400 animate-pulse text-center text-lg'>Obteniendo ubicación...</p>"; navigator.geolocation.getCurrentPosition((pos) => window.location.href = `https://wa.me/${phone}?text=${encodeURIComponent(message + " https://www.google.com/maps?q=" + pos.coords.latitude + "," + pos.coords.longitude)}`, () => window.location.href = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`); }
    window.sendPlainMessage = function(phone, message) { if(isDemo) return alert("🧪 Demo: Se abriría WhatsApp."); window.location.href = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`; }
    init();
  </script>
</body>
</html>
